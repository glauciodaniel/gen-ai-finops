services:
  postgres:
    image: postgres:16-alpine
    container_name: gen_ai_finops_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gen_ai_finops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gen_ai_finops_backend
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: gen_ai_finops
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gen_ai_finops
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: gen_ai_finops_admin
    ports:
      - "3100:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
